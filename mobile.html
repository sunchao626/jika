<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6fa" />
    <title>集卡司机端</title>
    <link rel="stylesheet" href="mobile.css" />
    <link rel="stylesheet" href="design-tokens.css" />
    <link rel="stylesheet" href="feedback-management.css" />
  </head>
  <body>
    <div class="phone-shell">
      <header class="mobile-header" id="mobileHeader">
        <div class="header-copy">
          <span class="eyebrow" id="headerEyebrow">集卡司机端</span>
          <h1 id="mobileTitle">运单</h1>
        </div>
      </header>

      <main class="mobile-main">
        <section class="mobile-view active" id="tasksView" data-title="运单">
          <div class="work-stage-tabs" id="workStageTabs" role="tablist" aria-label="运单状态">
            <button class="active" data-work-stage="active" type="button" role="tab" aria-selected="true"><span>进行中</span><strong id="activeOrderCount">0</strong></button>
            <button data-work-stage="pending" type="button" role="tab" aria-selected="false"><span>待接单</span><strong id="pendingOrderCount">0</strong></button>
          </div>
          <div class="task-list" id="taskList"></div>
        </section>

        <section class="mobile-view messages-view" id="messagesView" data-title="消息">
          <div class="driver-message-tabs" id="driverMessageTabs" role="group" aria-label="消息类型">
            <button class="active" data-message-filter="all" aria-pressed="true" type="button">全部</button>
            <button data-message-filter="task" aria-pressed="false" type="button">任务</button>
            <button data-message-filter="warning" aria-pressed="false" type="button">预警</button>
            <button data-message-filter="announcement" aria-pressed="false" type="button">公告</button>
          </div>
          <div class="driver-message-summary">
            <span class="driver-message-summary-icon"><i data-lucide="bell-ring"></i></span>
            <div><strong id="driverUnreadSummary">0 条未读消息</strong><small>任务与预警状态同步更新</small></div>
            <button id="driverReadAllButton" type="button">全部已读</button>
          </div>
          <div class="driver-message-list" id="driverMessageList" aria-live="polite"></div>
        </section>

        <section class="mobile-view profile-view" id="profileView" data-title="个人中心">
          <div class="profile-hero">
            <div class="avatar" id="profileAvatar">赵</div>
            <div class="profile-copy">
              <div class="profile-name-line"><h2 id="profileName">赵亮</h2><button id="profileCertificationBadge" data-profile-page="certification" type="button">未认证</button></div>
              <p id="profileMeta">自有司机 · 临港车队</p>
              <small id="profilePhone">139****6662</small>
              <div class="profile-identity-actions" aria-label="基础资料入口">
                <button data-profile-page="personal" type="button">基础信息 <b>›</b></button>
              </div>
            </div>
          </div>

          <section class="profile-order-panel">
            <header>
              <div><strong>我的运单</strong><span>运输任务进度</span></div>
              <button data-order-stage="all" type="button">查看全部 <b>›</b></button>
            </header>
            <div class="profile-order-stats" id="profileOrderStats"></div>
          </section>

          <section class="profile-menu-group profile-service-group">
            <h2>功能与服务</h2>
            <div class="profile-menu-list">
              <button data-profile-page="expenses" type="button"><span class="profile-menu-icon purple"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 8h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg></span><span>费用上报</span><b>›</b></button>
              <button class="profile-vehicle-row" data-profile-page="vehicle" type="button"><span class="profile-menu-icon green"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16V8l2-3h10l2 3v8M5 11h14M7 16v2M17 16v2"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/></svg></span><span>车辆信息</span><span class="profile-vehicle-summary"><strong id="profileVehiclePlate">暂未分配</strong><small id="profileVehicleDescription">暂无车辆信息</small></span><b>›</b></button>
              <button data-call-service type="button"><span class="profile-menu-icon blue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 16 0v5a2 2 0 0 1-2 2h-2v-7h4M4 12v5h4v-5H4M12 20h4"/></svg></span><span>客服电话</span><small>400-800-6688</small><b>›</b></button>
              <button data-profile-page="feedback" type="button"><span class="profile-menu-icon orange"><i data-lucide="message-square-plus" aria-hidden="true"></i></span><span>意见反馈</span><small>问题与建议</small><b>›</b></button>
              <button data-profile-page="settings" type="button"><span class="profile-menu-icon gray"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.7-1L14.5 3h-5L9 6.1a8 8 0 0 0-1.7 1l-2.4-1-2 3.4L5 11a7 7 0 0 0 0 2l-2.1 1.5 2 3.4 2.4-1a8 8 0 0 0 1.7 1l.5 3.1h5l.5-3.1a8 8 0 0 0 1.7-1l2.4 1 2-3.4L19 13a7 7 0 0 0 .1-1Z"/></svg></span><span>系统设置</span><b>›</b></button>
            </div>
          </section>
          <p class="version-text">集卡司机端 · 原型版 1.0</p>
        </section>

        <section class="detail-view" id="detailView" aria-hidden="true">
          <header class="detail-nav">
            <button class="icon-button" id="backFromDetail" type="button" aria-label="返回">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <strong>接单详情</strong>
            <button class="icon-button" id="detailMoreButton" type="button" aria-label="更多">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
            </button>
          </header>
          <div class="detail-scroll" id="detailContent"></div>
          <div class="detail-action-bar" id="detailActionBar"></div>
        </section>

        <section class="subpage-view" id="profileSubpage" aria-hidden="true">
          <header class="detail-nav">
            <button class="icon-button" id="backFromSubpage" type="button" aria-label="返回个人中心">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <strong id="subpageTitle">个人信息</strong>
            <span></span>
          </header>
          <div class="subpage-scroll" id="subpageContent"></div>
        </section>
      </main>

      <nav class="bottom-nav" id="bottomNav" aria-label="主导航">
        <button class="active" data-view="tasks" type="button">
          <span class="nav-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg></span><span>运单</span>
        </button>
        <button data-view="messages" type="button">
          <span class="nav-symbol"><i data-lucide="message-square-text"></i><em class="nav-message-badge" id="navMessageBadge" hidden>0</em></span><span>消息</span>
        </button>
        <button data-view="profile" type="button">
          <span class="nav-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span><span>我的</span>
        </button>
      </nav>

      <dialog class="bottom-sheet" id="rejectDialog">
        <form id="rejectForm">
          <div class="sheet-handle"></div>
          <header><div><strong>拒绝本次派单</strong><span>拒单原因将同步给调度员</span></div><button class="sheet-close" value="cancel" formmethod="dialog" type="button">×</button></header>
          <div class="reason-options">
            <label><input type="radio" name="reason" value="车辆故障" required /><span>车辆故障</span></label>
            <label><input type="radio" name="reason" value="时间冲突" /><span>时间冲突</span></label>
            <label><input type="radio" name="reason" value="身体不适" /><span>身体不适</span></label>
            <label><input type="radio" name="reason" value="其他原因" /><span>其他原因</span></label>
          </div>
          <label class="sheet-field">补充说明<textarea name="remark" rows="3" placeholder="请补充说明（选填）"></textarea></label>
          <button class="primary-action danger-action" type="submit">确认拒绝</button>
        </form>
      </dialog>

      <dialog class="bottom-sheet" id="progressDialog">
        <form id="progressForm">
          <div class="progress-dialog-scroll">
            <div class="sheet-handle"></div>
            <header><div><strong id="progressTitle">更新运输节点</strong><span id="progressHint">操作后将实时同步至调度后台</span></div><button class="sheet-close" type="button">×</button></header>
            <div class="next-node-card"><span>本次提交节点</span><strong id="nextNodeText">已提货</strong></div>
            <label class="sheet-field">现场说明<textarea name="remark" rows="3" placeholder="填写现场情况或异常说明"></textarea></label>
            <section class="photo-requirements" id="photoRequirements" aria-live="polite" hidden>
              <div class="photo-requirements-heading"><strong id="photoRequirementsTitle">拍照要求</strong><span id="photoRequirementsCount">0/0</span></div>
              <div class="photo-slot-list" id="photoSlotList"></div>
              <p class="photo-requirements-hint" id="photoRequirementsHint"></p>
            </section>
          </div>
          <button class="primary-action" type="submit">确认提交</button>
        </form>
      </dialog>

      <dialog class="photo-viewer-dialog" id="photoViewerDialog" aria-labelledby="photoViewerTitle">
        <div class="photo-viewer-panel">
          <header><strong id="photoViewerTitle">节点照片</strong><button class="sheet-close" id="photoViewerClose" type="button" aria-label="关闭图片预览">×</button></header>
          <div class="photo-viewer-grid" id="photoViewerGrid" aria-live="polite"></div>
        </div>
      </dialog>

      <div class="toast" id="toast" role="status"></div>
    </div>

    <script src="vendor/lucide.min.js"></script>
    <script src="capacity-ownership.js"></script>
    <script src="dispatch-store.js"></script>
    <script src="admin-data-bridge.js"></script>
    <script src="vehicle-repair.js"></script>
    <script src="dispatch-task-nodes.js"></script>
    <script src="photo-requirements.js"></script>
    <script src="expense-report.js"></script>
    <script src="feedback-management.js"></script>
    <script src="mobile.js"></script>
    <script src="platform-config.js"></script>
  </body>
</html>
